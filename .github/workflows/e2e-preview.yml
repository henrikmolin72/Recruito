name: E2E — Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rekryteringsplattform/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: rekryteringsplattform

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: rekryteringsplattform

      - name: Wait for Vercel preview
        id: vercel_preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
          max_timeout: 300

      - name: Run E2E suite
        run: npx playwright test
        working-directory: rekryteringsplattform
        env:
          E2E_BASE_URL: ${{ steps.vercel_preview.outputs.url }}
          E2E_COMPANY_EMAIL: ${{ secrets.E2E_COMPANY_EMAIL }}
          E2E_COMPANY_PASSWORD: ${{ secrets.E2E_COMPANY_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: rekryteringsplattform/playwright-report/
          retention-days: 7
